name: Windows LMO-PF2D Analyzer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build version-named onefile executable
        shell: pwsh
        run: |
          $appName = "LMO-PF2D-Analyzer-${{ github.ref_name }}"
          python -m PyInstaller --noconfirm --clean --onefile --console --hide-console hide-early --name $appName --add-data "analysis;analysis" --hidden-import scipy.optimize --hidden-import scipy.special --hidden-import matplotlib.pyplot --hidden-import matplotlib.patches --hidden-import matplotlib.backends.backend_pdf --hidden-import numpy --hidden-import pypdf --hidden-import PIL lmo_pf2d_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash ("dist/" + $appName + ".exe") -Algorithm SHA256 | Format-List
      - name: Smoke-test frozen Windows executable
        shell: pwsh
        run: |
          $exe = ".\\dist\\LMO-PF2D-Analyzer-${{ github.ref_name }}.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--analyze","--help" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Frozen EXE CLI smoke test failed: $($proc.ExitCode)" }
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "dist/LMO-PF2D-Analyzer-${{ github.ref_name }}.exe" --title "LMO PF2D Analyzer ${{ github.ref_name }}" --notes "Fix v1.2.0 CLI argparse failure. Auto-find unique nested RASX and prior batch result directories, create absent output folders, versioned Windows EXE filename. Includes full four-pole PDF reports; source data remain read-only." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep only the newest versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current = "${{ github.ref_name }}"
          if ($current -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid version tag" }
          $currentVersion = [version]($current.Substring(1))
          $previous = gh release list --limit 100 --json tagName --jq '.[].tagName'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tag in $previous) {
            if ($tag -and $tag -match '^v\d+\.\d+\.\d+$' -and [version]($tag.Substring(1)) -lt $currentVersion) {
              gh release delete $tag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
