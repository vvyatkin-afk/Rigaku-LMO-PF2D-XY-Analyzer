name: Windows LMO-PF2D Analyzer
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build version-named onefile executable
        shell: pwsh
        run: |
          $appName = "LMO-PF2D-Analyzer-${{ github.ref_name }}"
          python -m PyInstaller --noconfirm --clean --onefile --console --hide-console hide-early --name $appName --add-data "analysis;analysis" --hidden-import analysis.lattice_strain --hidden-import analysis.lattice_reports --hidden-import scipy.ndimage --hidden-import scipy.optimize --hidden-import scipy.special --hidden-import matplotlib.pyplot --hidden-import matplotlib.patches --hidden-import matplotlib.backends.backend_pdf --hidden-import numpy --hidden-import pypdf --hidden-import PIL lmo_pf2d_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash ("dist/" + $appName + ".exe") -Algorithm SHA256 | Format-List
      - name: Smoke-test frozen Windows executable
        shell: pwsh
        run: |
          $exe = ".\\dist\\LMO-PF2D-Analyzer-${{ github.ref_name }}.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--analyze","--help" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Frozen EXE CLI smoke test failed: $($proc.ExitCode)" }
          $smokePath = Join-Path $env:RUNNER_TEMP "pf2d-gui-smoke.json"
          $guiProc = Start-Process -FilePath $exe -ArgumentList @("--smoke-gui", $smokePath) -Wait -PassThru
          if ($guiProc.ExitCode -ne 0) { throw "Frozen GUI smoke test failed: $($guiProc.ExitCode)" }
          $smoke = Get-Content -Raw $smokePath | ConvertFrom-Json
          if ($smoke.status -ne "OK" -or $smoke.version -ne "${{ github.ref_name }}".TrimStart("v")) {
            throw "GUI smoke check failed"
          }
      - name: Test frozen executable on synthetic RASX
        shell: pwsh
        run: |
          $exe = ".\dist\LMO-PF2D-Analyzer-${{ github.ref_name }}.exe"
          $raw = Join-Path $env:RUNNER_TEMP "pf2d_synthetic_raw"
          $out = Join-Path $env:RUNNER_TEMP "pf2d_synthetic_output"
          $env:PF2D_SYNTH_RAW = $raw
          python -c "import os; from pathlib import Path; from tests.test_lattice_strain import simulated_frames; simulated_frames(Path(os.environ['PF2D_SYNTH_RAW']), phi_step=5)"
          if ($LASTEXITCODE -ne 0) { throw "Synthetic RASX generation failed" }
          $proc = Start-Process -FilePath $exe -ArgumentList @("--analyze", "--source", ('"' + $raw + '"'), "--output", ('"' + $out + '"')) -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Frozen RASX processing failed: $($proc.ExitCode)" }
          $result = Get-Content -Raw (Join-Path $out "inspection.json") | ConvertFrom-Json
          $good = @($result.groups[0].lattice_analysis.peaks | Where-Object { $_.radial_status -eq "OK" })
          if ($good.Count -lt 4) { throw "Frozen lattice analysis did not recover four radial peaks" }
          if (Get-ChildItem -Path $out -Recurse -Filter "*Error.txt") { throw "Frozen report extension failed" }
          if (!(Test-Path (Join-Path $out "Overall_Pole_Figure_Report.pdf"))) { throw "Missing batch PDF" }
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" "dist/LMO-PF2D-Analyzer-${{ github.ref_name }}.exe" --title "LMO PF2D Analyzer ${{ github.ref_name }}" --notes "Universal HyPix PF2D with measured radial 2theta profiles, d-spacing, configurable reference and conditional indexed lattice/strain. Extended original reports, raw-data read-only, explicit quality limits. Experimental calibration still required." --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep newest three versioned releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $current = "${{ github.ref_name }}"
          if ($current -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid version tag" }
          $currentVersion = [version]($current.Substring(1))
          $previous = gh release list --limit 100 --json tagName --jq '.[].tagName'
          $sortedVersions = @($previous | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]($_.Substring(1)) } -Descending)
          $keep = @($sortedVersions | Select-Object -First 3)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($tag in $previous) {
            if ($tag -and $tag -match '^v\d+\.\d+\.\d+$' -and ($tag -notin $keep) -and [version]($tag.Substring(1)) -lt $currentVersion) {
              gh release delete $tag --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
