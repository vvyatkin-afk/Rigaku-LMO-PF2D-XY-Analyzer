name: Windows LMO-PF2D Analyzer
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build onefile executable
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --hide-console hide-early --name LMO-PF2D-Analyzer --add-data "analysis;analysis" --hidden-import scipy.optimize --hidden-import scipy.special --hidden-import matplotlib.pyplot --hidden-import matplotlib.patches --hidden-import matplotlib.backends.backend_pdf --hidden-import numpy --hidden-import pypdf --hidden-import PIL lmo_pf2d_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash dist/LMO-PF2D-Analyzer.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: LMO-PF2D-Analyzer-${{ github.ref_name }}-Windows-x64
          path: dist/LMO-PF2D-Analyzer.exe
          if-no-files-found: error
      - name: Publish versioned GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/LMO-PF2D-Analyzer.exe --title "LMO PF2D Analyzer ${{ github.ref_name }}" --notes "Rich four-pole PDF reports, numeric XY positions, measured/model curves and fast report rebuild from saved maps (no rereading RASX). Offline instrument flows remain unvalidated." --latest
